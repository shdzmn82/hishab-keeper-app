name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: unzip HishabKeeper_Android_Project.zip -d app_project

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Gradle Wrapper
      working-directory: ./app_project
      run: gradle wrapper --gradle-version 8.1.0

    - name: Make gradlew executable
      working-directory: ./app_project
      run: chmod +x gradlew

    - name: Build Debug APK
      working-directory: ./app_project
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HishabKeeper-App
        path: app_project/app/build/outputs/apk/debug/app-debug.apk
